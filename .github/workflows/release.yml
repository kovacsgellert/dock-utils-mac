name: Release

# Push a version tag like 0.1.0 to build the production binary and publish it
# as a downloadable GitHub Release asset:
#   git tag 0.1.0 && git push origin 0.1.0
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"
  # Manual run from the Actions tab: builds only, no release is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 SDK or newer: the Dock clones use NSGlassEffectView.
    # Builds a universal (Apple Silicon + Intel) app; see package-app.sh.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Package .app + DMG + PKG
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Self-signed certificate (scripts/make-signing-cert.sh) keeps the
          # Accessibility grant across updates. Releases must have it: an
          # ad-hoc build would make every user re-grant.
          if [ -n "$SIGNING_P12_BASE64" ]; then
            export SIGNING_P12="$RUNNER_TEMP/signing.p12"
            echo "$SIGNING_P12_BASE64" | base64 --decode > "$SIGNING_P12"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "::error::SIGNING_P12_BASE64 secret is not set; refusing to publish an ad-hoc signed release"
            exit 1
          fi
          VERSION="${{ github.ref_name }}" ./scripts/package-app.sh
          ./scripts/make-dmg.sh
          VERSION="${{ github.ref_name }}" ./scripts/make-pkg.sh
          cp README.md LICENSE dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes come from CHANGELOG.md (title line dropped: the release
          # has its own). Tags with a hyphen suffix (e.g. 0.1.0-alpha1)
          # become prereleases.
          ./scripts/release-notes.sh "${{ github.ref_name }}" | tail -n +3 > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::No CHANGELOG.md section for ${{ github.ref_name }}"; exit 1; }
          FLAGS="--notes-file $RUNNER_TEMP/notes.md"
          case "${{ github.ref_name }}" in *-*) FLAGS="$FLAGS --prerelease";; esac
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            $FLAGS \
            "dist/dock-utils-${{ github.ref_name }}-macos-universal.dmg" \
            "dist/dock-utils-${{ github.ref_name }}-macos-universal.pkg"
